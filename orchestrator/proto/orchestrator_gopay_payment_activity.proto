syntax = "proto3";

package orchestrator;

import "google/protobuf/struct.proto";

option go_package = "./;pb";

message GoPayActivityInput {
  string job_id = 1;
  string account_id = 2;
  string session_token = 3;
  string access_token = 4;
  bool use_account_token = 5;
  string tokenization = 6;
  string checkout_url = 7;
  string checkout_session_id = 8;
  string otp_channel = 9; // sms 时 payment 触发 resend-otp；wa/空值不触发
  string state_json = 10;
  string prepared_flow_id = 11;
  string gopay_phone = 12;
  string sms_activation_id = 13;
  string gopay_account_id = 14; // GoPayAccount state owner and OTP target.
  bool skip_account_balance_check = 15; // 已有 GoPay state 直接支付时跳过余额等待
  string pin = 16; // GoPay PIN；需要 PIN 的步骤必须由调用方显式传入
  string country_code = 17; // 电话区号；需要链接 GoPay 的步骤必须由调用方显式传入
  string proxy_url = 18; // workflow 前置动态代理；仅运行时透传，不持久化
}

message GoPayPaymentPrepareOutput {
  string flow_id = 1;
  string snap_token = 2;
  string checkout_url = 3;
  string checkout_session_id = 4;
  bool use_account_token = 5;
  google.protobuf.Struct data = 6;
  string state_json = 7;
  bool retryable_fresh_checkout = 8;
  int32 checkout_attempt = 9;
  string stage = 10;
}
