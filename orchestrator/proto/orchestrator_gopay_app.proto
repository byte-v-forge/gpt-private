syntax = "proto3";

package orchestrator;

import "gopay_app.proto";
import "google/protobuf/struct.proto";

option go_package = "./;pb";

service GoPayAppWorkflowService {
  rpc RunGoPayApp(GoPayAppRequest) returns (GoPayAppResponse);
  rpc RunGoPayPayment(GoPayPaymentRequest) returns (GoPayPaymentResponse);
  rpc RunGoPayQRISPaymentActivate(GoPayQRISPaymentActivateRequest) returns (GoPayPaymentResponse);
  rpc RunGoPayWAPayment(GoPayWAPaymentRequest) returns (GoPayPaymentResponse);
  rpc RetryGoPayPaymentRebind(GoPayPaymentRebindRequest) returns (GoPayPaymentResponse);
  rpc ConfirmManualGoPayPayment(ConfirmManualGoPayPaymentRequest) returns (ConfirmManualGoPayPaymentResponse);
  rpc GetGopayAccount(gopay_app.GetGopayAccountRequest) returns (gopay_app.GetGopayAccountResponse);
  rpc ListGopayAccounts(gopay_app.ListGopayAccountsRequest) returns (gopay_app.ListGopayAccountsResponse);
  rpc DeleteGopayAccount(gopay_app.DeleteGopayAccountRequest) returns (gopay_app.DeleteGopayAccountResponse);
  rpc GoPayAccountStatus(GoPayAccountStatusRequest) returns (GoPayAccountStatusResponse);
  rpc GoPayAccountClearState(GoPayAccountClearStateRequest) returns (GoPayAccountClearStateResponse);
  rpc GoPayAccountSetWAPhone(GoPayAccountSetWAPhoneRequest) returns (GoPayAccountWAPhoneResponse);
  rpc GoPayAccountGetWAPhone(GoPayAccountGetWAPhoneRequest) returns (GoPayAccountWAPhoneResponse);
  rpc GoPayAccountCheckPhone(GoPayAccountCheckPhoneRequest) returns (GoPayAccountCheckPhoneResponse);
  rpc GoPayAccountCheckBalance(GoPayAccountCheckBalanceRequest) returns (GoPayAccountCheckBalanceResponse);
  rpc GoPayAccountAuthStart(GoPayAccountAuthStartRequest) returns (GoPayAccountAuthStartResponse);
  rpc GoPayAccountAuthComplete(GoPayAccountAuthCompleteRequest) returns (GoPayAccountAuthCompleteResponse);
  rpc GoPayAccountChangePhoneStart(GoPayAccountChangePhoneStartRequest) returns (GoPayAccountChangePhoneStartResponse);
  rpc GoPayAccountChangePhoneComplete(GoPayAccountChangePhoneCompleteRequest) returns (GoPayAccountChangePhoneCompleteResponse);
  rpc GoPayAccountChangePhoneRetry(GoPayAccountChangePhoneRetryRequest) returns (GoPayAccountChangePhoneRetryResponse);
  rpc GoPayAccountSignupStart(GoPayAccountSignupStartRequest) returns (GoPayAccountSignupStartResponse);
  rpc GoPayAccountSignupComplete(GoPayAccountSignupCompleteRequest) returns (GoPayAccountSignupCompleteResponse);
  rpc GoPayAccountCreatePinStart(GoPayAccountCreatePinStartRequest) returns (GoPayAccountCreatePinStartResponse);
  rpc GoPayAccountCreatePinComplete(GoPayAccountCreatePinCompleteRequest) returns (GoPayAccountCreatePinCompleteResponse);
}

message EnsureLogonRequest {
  string job_id = 1;
  string account_id = 2;
  string gopay_account_id = 3;
}

message EnsureLogonResponse {
  bool ready = 1;
  string stage = 2;
  string phone = 3;
  gopay_app.StatusResponse status_before = 4;
  gopay_app.StatusResponse status_after = 5;
  bool already_ready = 6;
  bool change_phone_complete = 7;
  bool deactivate_complete = 8;
  bool logon_complete = 9;
  bool account_token_ready = 10;
  string error_message = 11;
  bool signup_complete = 12;
  bool signup_pin_complete = 13;
}

message GoPayAppRequest {
  string phone = 1;
  string country_code = 2;
  string pin = 3;
  string otp_channel = 4;
  string gopay_account_id = 5;
  string operation = 6; // login/signup/create_pin/check_balance/check_pin/change_phone/provision
}

message GoPayAppResponse {
  string job_id = 1;
  bool started = 2;
  string error_message = 3;
}

message GoPayPaymentRequest {
  string account_id = 1;
  string source_job_id = 2;
  string gopay_account_id = 3; // GoPayAccount state owner; otp_channel/PIN/phone are resolved by gopay-app.
  string tokenization = 4; // true / false / qris
  reserved 5, 6, 7, 8, 9, 10;
  reserved "add_balance", "add_balance_confirm_timeout_seconds", "sms_activation_id", "wa_phone", "pin", "country_code";
}

message GoPayWAPaymentRequest {
  oneof payer {
    string account_id = 1;
    string access_token = 5;
  }
  string source_job_id = 2;
  string gopay_account_id = 3; // GoPayAccount state owner and OTP target.
  string wa_phone = 4; // WA 支付手机号；调用方必须显式传入
  string pin = 6; // GoPay PIN；需要 PIN 的步骤必须由调用方显式传入
  string country_code = 7; // 电话区号，例如 "+62"；为空时 provider 使用 GoPay 默认国家区号
}

message GoPayQRISPaymentActivateRequest {
  string account_id = 1;
  string source_job_id = 2;
  string gopay_account_id = 3;
  reserved 4 to 8;
  reserved "add_balance", "add_balance_confirm_timeout_seconds", "gopay_phone", "pin", "country_code";
}

message GoPayPaymentResponse {
  string job_id = 1;
  bool started = 2;
  bool success = 3;
  string error_message = 4;
  string charge_ref = 5;
  string snap_token = 6;
  string activation_id = 7;
  string phone = 8;
  reserved 9, 10, 11;
  reserved "add_balance_complete", "add_balance_method", "add_balance_status";
  string wa_phone = 12;
  string bound_phone = 13;
  string change_phone_activation_id = 14;
  bool change_phone_complete = 15;
  string gopay_account_id = 16;
}

message GoPayPaymentRebindRequest {
  string source_job_id = 1;
  string account_id = 2;
  string gopay_account_id = 3;
  string pin = 4;
  string country_code = 5;
}

message ConfirmManualGoPayPaymentRequest {
  string job_id = 1;
}

message ConfirmManualGoPayPaymentResponse {
  bool success = 1;
  string job_id = 2;
  string error_message = 3;
}

message GoPayAccountStatusRequest {
  string gopay_account_id = 1;
}

message GoPayAccountStatusResponse {
  bool success = 1;
  string error_message = 2;
  gopay_app.StatusResponse status = 3;
}

message GoPayAccountClearStateRequest {
  string gopay_account_id = 1;
}

message GoPayAccountClearStateResponse {
  bool success = 1;
  string error_message = 2;
}

message GoPayAccountSetWAPhoneRequest {
  reserved 3;
  reserved "pin";

  string gopay_account_id = 1;
  string wa_phone = 2;
}

message GoPayAccountGetWAPhoneRequest {
  string gopay_account_id = 1;
}

message GoPayAccountWAPhoneResponse {
  reserved 5;
  reserved "pin";

  bool success = 1;
  string error_message = 2;
  string gopay_account_id = 3;
  string wa_phone = 4;
}

message GoPayAccountCheckPhoneRequest {
  string gopay_account_id = 1;
  string phone = 2;
  string country_code = 3;
}

message GoPayAccountCheckPhoneResponse {
  bool success = 1;
  string error_message = 2;
  bool available = 3;
  string status = 4;
}

message GoPayAccountCheckBalanceRequest {
  string gopay_account_id = 1;
}

message GoPayAccountCheckBalanceResponse {
  bool success = 1;
  string error_message = 2;
  string stage = 3;
  string phone = 4;
  bool token_valid = 5;
  bool refreshed = 6;
  int64 balance_amount = 7;
  bool has_min_balance = 8;
  string balance_currency = 9;
}

message GoPayAccountAuthStartRequest {
  string gopay_account_id = 1;
  string phone = 2;
  string country_code = 3;
  string pin = 4;
  string otp_channel = 5; // sms 或 wa；为空时由 provider 选择当前流程默认通道
}

message GoPayAccountAuthStartResponse {
  bool success = 1;
  string error_message = 2;
  string mode = 3;
  string stage = 4;
  bool otp_sent = 5;
  string verification_id = 6;
  string verification_method = 7;
  bool ready = 8;
  bool pin_setup_required = 9;
}

message GoPayAccountAuthCompleteRequest {
  string gopay_account_id = 1;
  string otp = 2;
  string pin = 3;
}

message GoPayAccountAuthCompleteResponse {
  bool success = 1;
  string error_message = 2;
  string mode = 3;
  string stage = 4;
  string phone = 5;
  bool ready = 6;
  bool pin_setup_required = 7;
  bool pin_setup_complete = 8;
}

message GoPayAccountChangePhoneStartRequest {
  string gopay_account_id = 1;
  string new_phone = 2;
  string pin = 3;
  string country_code = 4;
}

message GoPayAccountChangePhoneStartResponse {
  bool success = 1;
  string error_message = 2;
  string new_phone = 3;
  bool otp_sent = 4;
}

message GoPayAccountChangePhoneCompleteRequest {
  string gopay_account_id = 1;
  string otp = 2;
}

message GoPayAccountChangePhoneCompleteResponse {
  bool success = 1;
  string error_message = 2;
}

message GoPayAccountChangePhoneRetryRequest {
  string gopay_account_id = 1;
}

message GoPayAccountChangePhoneRetryResponse {
  bool success = 1;
  string error_message = 2;
  bool otp_sent = 3;
}

message GoPayAccountSignupStartRequest {
  string gopay_account_id = 1;
  string phone = 2;
  string name = 3;
  string email = 4;
  string country_code = 5;
  string otp_channel = 6; // sms 或 wa；为空默认 sms
}

message GoPayAccountSignupStartResponse {
  bool success = 1;
  string error_message = 2;
  bool otp_sent = 3;
  string verification_id = 4;
  string verification_method = 5;
}

message GoPayAccountSignupCompleteRequest {
  string gopay_account_id = 1;
  string otp = 2;
}

message GoPayAccountSignupCompleteResponse {
  bool success = 1;
  string error_message = 2;
  string phone = 3;
  bool pin_setup_required = 4;
}

message GoPayAccountCreatePinStartRequest {
  string gopay_account_id = 1;
  string pin = 2;
  string otp_channel = 3; // sms 或 wa；为空默认 sms
}

message GoPayAccountCreatePinStartResponse {
  bool success = 1;
  string error_message = 2;
  bool otp_sent = 3;
  string verification_id = 4;
  string verification_method = 5;
}

message GoPayAccountCreatePinCompleteRequest {
  string gopay_account_id = 1;
  string otp = 2;
  string pin = 3;
}

message GoPayAccountCreatePinCompleteResponse {
  bool success = 1;
  string error_message = 2;
  string phone = 3;
  bool pin_setup_complete = 4;
}

message GoPayAppStepInput {
  string job_id = 1;
  string activation_id = 2;
  string state_json = 3;
}

message GoPayAppStepOutput {
  string activation_id = 1;
  bool ready = 2;
  string stage = 3;
  string phone = 4;
  bool account_token_ready = 5;
  bool change_phone_complete = 6;
  bool deactivate_complete = 7;
  bool signup_complete = 8;
  bool signup_pin_complete = 9;
  google.protobuf.Struct data = 10;
  string state_json = 11;
}

message GoPayAppChangePhoneStartInput {
  string job_id = 1;
  int32 failure_count = 2;
  string state_json = 3;
  string activation_id = 4;
  string phone = 5;
  string pin = 6;
  string country_code = 7;
}

message GoPayAppChangePhoneStartOutput {
  string activation_id = 1;
  string phone = 2;
  int32 failure_count = 3;
  int32 max_failures = 4;
  int32 otp_timeout_seconds = 5;
  int32 otp_retry_attempts = 6;
  google.protobuf.Struct data = 7;
  string state_json = 8;
  bool retryable_failure = 9;
  string error_message = 10;
}

message GoPayAppChangePhoneGetNumberInput {
  string job_id = 1;
  int32 failure_count = 2;
  string account_id = 3;
  string gopay_account_id = 4;
  string country_code = 5;
}

message GoPayAppChangePhoneGetNumberOutput {
  string activation_id = 1;
  string phone = 2;
  int32 failure_count = 3;
  int32 max_failures = 4;
  google.protobuf.Struct data = 5;
}

message GoPayAppAcquireSignupPhoneInput {
  string job_id = 1;
  int32 failure_count = 2;
}

message GoPayAppAcquireSignupPhoneOutput {
  string activation_id = 1;
  string phone = 2;
  int32 failure_count = 3;
  int32 max_failures = 4;
  int32 otp_timeout_seconds = 5;
  google.protobuf.Struct data = 6;
  string state_json = 7;
}

message GoPayAppGenerateDeviceProxyInput {
  string job_id = 1;
  string account_id = 2;
  string country_code = 3;
}

message GoPayAppGenerateDeviceProxyOutput {
  string state_json = 1;
  int32 proxy_slot = 2;
  int32 dynamic_egress_size = 3;
  string proxy_hash = 4;
  string device_fingerprint = 5;
  google.protobuf.Struct data = 6;
}

message GoPayAppCheckSignupPhoneInput {
  string job_id = 1;
  string activation_id = 2;
  string phone = 3;
  string country_code = 4;
  string state_json = 5;
}

message GoPayAppCheckSignupPhoneOutput {
  string activation_id = 1;
  string phone = 2;
  string status = 3;
  bool available = 4;
  string state_json = 5;
  int32 proxy_slot = 6;
  int32 dynamic_egress_size = 7;
  string proxy_hash = 8;
  string device_fingerprint = 9;
  google.protobuf.Struct data = 10;
}

message GoPayResolveWAPhoneInput {
  string job_id = 1;
  string gopay_account_id = 2;
  string wa_phone = 3;
}

message GoPayResolveWAPhoneOutput {
  string gopay_account_id = 1;
  string wa_phone = 2;
  google.protobuf.Struct data = 3;
}

message GoPayAppStateActivityInput {
  string job_id = 1;
  string gopay_account_id = 2;
  string state_json = 3;
  string reason = 4;
}

message GoPayAppStateActivityOutput {
  string gopay_account_id = 1;
  string state_json = 2;
  google.protobuf.Struct data = 3;
}

message GoPayPaymentRebindSourceInput {
  string job_id = 1;
  string source_job_id = 2;
  string account_id = 3;
  string gopay_account_id = 4;
}

message GoPayPaymentRebindSourceOutput {
  string source_job_id = 1;
  string account_id = 2;
  string gopay_account_id = 3;
  string wa_phone = 4;
  string charge_ref = 5;
  string snap_token = 6;
  google.protobuf.Struct data = 7;
}

message GoPayAppChangePhoneRetryInput {
  string job_id = 1;
  string activation_id = 2;
  int32 otp_attempt = 3;
  string state_json = 4;
}

message GoPayAppChangePhoneRetryOutput {
  string activation_id = 1;
  bool otp_sent = 2;
  string error_message = 3;
  google.protobuf.Struct data = 4;
  string state_json = 5;
}

message GoPayAppSMSActivationInput {
  string job_id = 1;
  string activation_id = 2;
  int32 failure_count = 3;
  string reason = 4;
}

message GoPayAppSMSActivationOutput {
  string activation_id = 1;
  int32 failure_count = 2;
  int32 max_failures = 3;
  string error_message = 4;
  google.protobuf.Struct data = 5;
}

message GoPayAppChangePhoneCompleteInput {
  string job_id = 1;
  string activation_id = 2;
  string code = 3;
  int32 failure_count = 4;
  string state_json = 5;
  string otp_param = 6;
  string submitted_at_param = 7;
  int64 issued_after_unix = 8;
}

message GoPayAppChangePhoneCompleteOutput {
  string activation_id = 1;
  bool change_phone_complete = 2;
  bool retryable_failure = 3;
  int32 failure_count = 4;
  int32 max_failures = 5;
  string error_message = 6;
  string stage = 7;
  string phone = 8;
  google.protobuf.Struct data = 9;
  string state_json = 10;
}

message GoPayAppDeactivateStartInput {
  string job_id = 1;
  string activation_id = 2;
  string state_json = 3;
  string pin = 4;
}

message GoPayAppDeactivateStartOutput {
  string activation_id = 1;
  bool otp_required = 2;
  int32 timeout_seconds = 3;
  google.protobuf.Struct data = 4;
  string state_json = 5;
}

message GoPayAppDeactivateCompleteInput {
  string job_id = 1;
  string activation_id = 2;
  string code = 3;
  string state_json = 4;
  string otp_param = 5;
  string submitted_at_param = 6;
  int64 issued_after_unix = 7;
}

message GoPayAppDeactivateCompleteOutput {
  string activation_id = 1;
  bool deactivate_complete = 2;
  google.protobuf.Struct data = 3;
  string state_json = 4;
}

message GoPayAppOTPStartInput {
  string job_id = 1;
  string operation = 2;
  string step_name = 3;
  string phone = 4;
  string otp_channel = 5; // sms 或 wa；默认 sms
  string sms_activation_id = 6;
  bool reset_state = 7;
  string state_json = 8;
  string pin = 9;
  string country_code = 10;
  bool skip_phone_probe = 11;
}

message GoPayAppCreatePinStartInput {
  string job_id = 1;
  string otp_channel = 2; // sms 或 wa；默认 sms
  string sms_activation_id = 3;
  string state_json = 4;
  google.protobuf.Struct data = 5;
  string pin = 6;
}

message GoPayAppOTPOutput {
  string operation = 1;
  bool otp_required = 2;
  int64 issued_after_unix = 3;
  int32 timeout_seconds = 4;
  bool ready = 5;
  bool account_token_ready = 6;
  bool signup_complete = 7;
  bool signup_pin_complete = 8;
  bool pin_setup_required = 9;
  string stage = 10;
  string phone = 11;
  google.protobuf.Struct data = 12;
  string verification_method = 13;
  string otp_channel = 14;
  string state_json = 15;
}

message GoPayAppCreatePinCompleteInput {
  string job_id = 1;
  string otp_param = 2;
  string submitted_at_param = 3;
  int64 issued_after_unix = 4;
  string otp_source = 5;
  google.protobuf.Struct data = 6;
  string otp_channel = 7;
  string sms_activation_id = 8;
  string state_json = 9;
  string pin = 10;
}

message GoPayAppOTPCompleteInput {
  string job_id = 1;
  string operation = 2;
  string otp_param = 3;
  string submitted_at_param = 4;
  int64 issued_after_unix = 5;
  string otp_source = 6;
  google.protobuf.Struct data = 7;
  string otp_channel = 8;
  string sms_activation_id = 9;
  string state_json = 10;
  string pin = 11;
}
